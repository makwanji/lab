services:
  bind9:
    image: ubuntu/bind9:9.18-24.04_beta
    container_name: bind9
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"

    environment:
      - TZ=Asia/Singapore

    volumes:
      - ./config:/etc/bind
      - ./cache:/var/cache/bind
      - ./records:/var/lib/bind

    networks:
      bind9_net:
        ipv4_address: 172.30.0.10

networks:
  bind9_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
